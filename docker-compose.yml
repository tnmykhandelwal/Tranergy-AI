# Optional local services. The API normally points at Supabase (DATABASE_URL in .env);
# use this postgres only if you want a local database instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tranergy
      POSTGRES_PASSWORD: tranergy
      POSTGRES_DB: tranergy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tranergy"]
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"

volumes:
  pgdata:
